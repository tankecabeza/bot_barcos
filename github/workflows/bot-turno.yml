name: Bot Puerto - turno de 12 h

# Se lanza A MANO desde GitHub (web o app móvil): Actions > "Bot Puerto - turno de 12 h" > Run workflow
on:
  workflow_dispatch:

concurrency:
  group: bot-puerto
  cancel-in-progress: false

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASS: ${{ secrets.SMTP_PASS }}
  TIP_POR_DEFECTO: ${{ secrets.TIP_POR_DEFECTO }}
  PRIMERA_PASADA_SILENCIOSA: "1"
  DURACION_MAX_MIN: "350"   # el bot se apaga solo a las 5 h 50 min (límite de GitHub: 6 h por job)

jobs:
  tramo1:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py

  tramo2:
    needs: tramo1
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py
